name: Kids APK

# Builds an installable APK every time the kids branch is pushed,
# or on demand from the Actions tab ("Run workflow").
on:
  push:
    branches: [kids]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Codegen
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      # Sign with Dan's permanent key when the secrets are set, so each new APK
      # installs over the last one. Without them the build falls back to a
      # throwaway debug key (uninstall the old app before installing).
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KIDS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KIDS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kids-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=kids\nstoreFile=kids-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Signing with permanent Kids key"
          else
            echo "::warning::KIDS_KEYSTORE secrets not set - using a throwaway debug key"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kids-plezy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/kids-release.jks android/key.properties
